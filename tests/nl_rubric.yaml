rubrics:
  - id: 1
    type: f2p
    text: "报告入口把相对 from 和 to 一次解析为同一绝对时间窗口，并在整条调用链中复用。"
  - id: 2
    type: f2p
    text: "报告记录初始仪表盘版本，模型、文件夹权限资源和面板元数据都关联该版本快照。"
  - id: 3
    type: f2p
    text: "原生或远端 PNG 和 CSV 下载使用与模型相同的仪表盘版本及绝对时间窗口。"
  - id: 4
    type: f2p
    text: "最终 HTML 或 PDF 的面板、表格、标题布局和显示时间全部来自同一快照。"
  - id: 5
    type: f2p
    text: "发现仪表盘版本变化时丢弃该轮未发布结果，并从新版本重建完整候选而不混合新旧面板。"
  - id: 6
    type: f2p
    text: "快照重建期间权限拒绝会直接失败，不会用旧权限结果或旧报告继续生成。"
  - id: 7
    type: f2p
    text: "仪表盘持续变化直到请求期限时返回冲突结果，不会发布任何过期候选。"
  - id: 8
    type: p2p
    text: "显式绝对时间、未修改仪表盘、HTML 与 PDF、本地与远端渲染以及空表格保持兼容。"
