rubrics:
  - id: 1
    type: f2p
    text: "新配置代际只有在配置、HTTP 客户端、浏览器和工作容量全部就绪后才接收报告请求。"
  - id: 2
    type: f2p
    text: "候选代际任一初始化失败都会关闭本次已创建资源，旧代际继续服务且不出现短暂切换。"
  - id: 3
    type: f2p
    text: "每个报告从入口到响应结束始终使用同一代际的配置、客户端、工作池和浏览器。"
  - id: 4
    type: f2p
    text: "代际切换后旧实例不再接收新请求，并等待已有报告归还租约后再关闭资源。"
  - id: 5
    type: f2p
    text: "模型读取、权限检查、PNG、CSV、HTML 和 PDF 阶段不会在一次报告中跨用新旧代际资源。"
  - id: 6
    type: f2p
    text: "旧代际排空期间再次更新配置只替换尚未启用的候选，不会关闭活动代际或已有报告使用的旧代际。"
  - id: 7
    type: f2p
    text: "进程退出会在有界等待后终止剩余租约并清理本地或远端 Chromium 及其余代际资源。"
  - id: 8
    type: p2p
    text: "正常启动、无配置更新时的并发报告以及既有配置优先级保持兼容。"
